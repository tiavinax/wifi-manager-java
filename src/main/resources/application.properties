# ============================================================
# WiFi Manager - Configuration Application
# ============================================================

# ===== SERVEUR PRINCIPAL (Dashboard) =====
server.port=8080
server.servlet.context-path=/
spring.application.name=WiFi Manager

# ===== LOGGING =====
logging.level.root=INFO
logging.level.com.wifimanager=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/app.log

# ===== MODULE 1 : DÉTECTION =====
detector.port=8081
detector.interface=wlan0
detector.subnet=192.168.1.0/24
detector.scan.interval=30000
detector.dhcp.file=/var/lib/dhcp/dhcpd.leases

# ===== MODULE 2 : CONTRÔLE =====
enforcer.port=8082
enforcer.enabled=true

# ===== MODULE 3 : INSPECTION =====
inspector.port=8083
inspector.enabled=true
inspector.dpi.enabled=false

# ===== BDD =====
database.driver=org.sqlite.JDBC
database.file=data/wifimanager.db
database.enable-wal=true

# ===== THYMELEAF (Dashboard) =====
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== WEBSOCKET (Updates live) =====
spring.websocket.enabled=true
