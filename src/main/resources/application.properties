# # ============================================================
# # WiFi Manager - Configuration Application
# # ============================================================

# ====================================================
# CONFIGURATION SPRING BOOT - WIFI MANAGER DASHBOARD
# ====================================================

# Serveur
server.port=8080
server.error.whitelabel.enabled=false
server.error.path=/error

# Application
spring.application.name=wifi-manager-dashboard
spring.main.allow-bean-definition-overriding=true  

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.servlet.content-type=text/html

# Static resources
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache-period=0
spring.mvc.favicon.enabled=false

# Logging
logging.level.com.wifimanager.dashboard=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Module 1 - Détection
detector.api.url=http://localhost:8081
detector.api.timeout=5000

# Module 2 - Enforcer
enforcer.api.url=http://localhost:8082
enforcer.api.timeout=5000

# Dashboard
dashboard.refresh.interval=30
dashboard.client.timeout=60

