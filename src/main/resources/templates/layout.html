<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title th:text="${pageTitle} + ' - WiFi Manager'">WiFi Manager Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="/css/dashboard.css" rel="stylesheet">

    <style>
        /* Design Premium avec coins arrondis et ombres */
        :root {
            --primary: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3f37c9;
            --secondary: #4cc9f0;
            --success: #06d6a0;
            --warning: #ffb703;
            --danger: #e63946;
            --dark: #1e1e2e;
            --dark-light: #2b2d42;
            --gray: #6c757d;
            --gray-light: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .dashboard-wrapper {
            display: flex;
            min-height: 100vh;
            padding: 20px;
        }

        /* Sidebar Premium */
        .sidebar {
            width: 348px;
            background: linear-gradient(180deg, var(--dark) 0%, var(--dark-light) 100%);
            border-radius: 30px;
            padding: 25px;
            margin-right: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            color: white;
            transition: all 0.3s ease;
        }

        .sidebar:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.2);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .logo-icon {
            font-size: 2.5rem;
            color: var(--secondary);
            background: rgba(76, 201, 240, 0.1);
            padding: 10px;
            border-radius: 15px;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }

        .user-avatar i {
            font-size: 2.2rem;
            color: var(--secondary);
        }

        .user-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .user-role {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .modules-status {
            margin-bottom: 30px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-online {
            background: rgba(6, 214, 160, 0.2);
            color: var(--success);
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transform: translateX(5px);
        }

        .nav-link i {
            font-size: 1.2rem;
            width: 24px;
        }

        .nav-item.active .nav-link {
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            color: white;
            box-shadow: 0 5px 15px rgba(67, 97, 238, 0.4);
        }

        .nav-badge {
            margin-left: auto;
            background: var(--danger);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
        }

        .nav-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 20px 0;
        }

        .sidebar-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
        }

        .network-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: rgba(255, 255, 255, 0.7);
        }

        .network-info i {
            font-size: 1.3rem;
            color: var(--secondary);
        }

        /* Main Content Premium */
        .main-content {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
        }

        .page-title h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin: 0;
        }

        .breadcrumb {
            background: transparent;
            padding: 0;
            margin: 5px 0 0;
        }

        .breadcrumb-item a {
            color: var(--primary);
            text-decoration: none;
        }

        .btn-refresh {
            width: 45px;
            height: 45px;
            border-radius: 15px;
            background: white;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background: var(--primary);
            color: white;
            transform: rotate(180deg);
        }

        .notification-badge {
            position: relative;
            cursor: pointer;
        }

        .notification-badge i {
            font-size: 1.5rem;
            color: var(--gray);
        }

        .notification-badge .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: white;
            border-radius: 10px;
            padding: 3px 8px;
            font-size: 0.7rem;
        }

        .date-time {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--gray);
            background: var(--gray-light);
            padding: 10px 20px;
            border-radius: 15px;
        }

        /* Cards Statistiques Premium */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(67, 97, 238, 0.15);
        }

        .stat-info h4 {
            font-size: 0.9rem;
            color: var(--gray);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--dark);
            line-height: 1;
            margin-bottom: 10px;
        }

        .stat-detail {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .stat-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(67, 97, 238, 0.1), rgba(76, 201, 240, 0.1));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon i {
            font-size: 2.5rem;
            color: var(--primary);
        }

        /* Tableaux Premium */
        .table-container {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        .table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .table-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
            margin: 0;
        }

        .table-search {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--gray-light);
            padding: 10px 20px;
            border-radius: 15px;
        }

        .table-search i {
            color: var(--gray);
        }

        .table-search input {
            border: none;
            background: transparent;
            outline: none;
            width: 250px;
        }

        .table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
        }

        .table thead th {
            background: var(--gray-light);
            padding: 15px;
            font-weight: 600;
            color: var(--dark);
            border: none;
            border-radius: 15px;
        }

        .table tbody tr {
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .table tbody tr:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.1);
        }

        .table tbody td {
            padding: 15px;
            vertical-align: middle;
            border: none;
        }

        .status-active {
            background: rgba(6, 214, 160, 0.1);
            color: var(--success);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-inactive {
            background: rgba(230, 57, 70, 0.1);
            color: var(--danger);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Formulaires Premium */
        .form-card {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            margin-bottom: 25px;
        }

        .form-card h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--gray-light);
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .form-control,
        .form-select {
            border: 2px solid var(--gray-light);
            border-radius: 15px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }

        .btn {
            padding: 12px 25px;
            border-radius: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(67, 97, 238, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger), #ff6b6b);
            color: white;
        }

        .progress {
            height: 8px;
            border-radius: 10px;
            background: var(--gray-light);
            margin: 10px 0;
        }

        .progress-bar {
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .progress-bar.warning {
            background: linear-gradient(90deg, var(--warning), #ffd93d);
        }

        .progress-bar.danger {
            background: linear-gradient(90deg, var(--danger), #ff8787);
        }

        .notification-area {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            min-width: 300px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: slideIn 0.3s ease;
        }

        .sidebar1 {
            width: 348px;
            background: linear-gradient(180deg, var(--dark) 0%, var(--dark-light) 100%);
            border-radius: 30px;
            padding: 25px;
            margin-right: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            color: white;
            transition: all 0.3s ease;
            height: 97vh;
        }

        /* personnaliser */
        .main-content1 {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 77%;
            margin-left: 20%;
            height: 97vh;
            position: fixed;
        }

        .top-bar1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 44px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.05);
            padding: 37px;
            border-radius: 12px;
            background-color: white;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            .dashboard-wrapper {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                margin-right: 0;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar Premium -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="bi bi-wifi logo-icon"></i>
                <span class="logo-text">WiFi Manager</span>
            </div>

            <div class="user-info">
                <div class="user-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">Administrateur</div>
                    <div class="user-role">Super Admin</div>
                </div>
            </div>

            <div class="modules-status">
                <div class="status-item">
                    <span>Module 1 - Détection</span>
                    <span class="status-badge status-online" id="module1Status">
                        <i class="bi bi-check-circle-fill"></i> En ligne
                    </span>
                </div>
                <div class="status-item">
                    <span>Module 2 - Enforcer</span>
                    <span class="status-badge status-online" id="module2Status">
                        <i class="bi bi-check-circle-fill"></i> En ligne
                    </span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2"></i>
                            <span>Tableau de bord</span>
                        </a>
                    </li>
                    <li class="nav-item" th:classappend="${activeMenu == 'clients' ? 'active' : ''}">
                        <a class="nav-link" href="/clients">
                            <i class="bi bi-devices"></i>
                            <span>Clients</span>
                            <span class="nav-badge" id="clientsCount">12</span>
                        </a>
                    </li>
                    <li class="nav-item" th:classappend="${activeMenu == 'quotas' ? 'active' : ''}">
                        <a class="nav-link" href="/quotas">
                            <i class="bi bi-sliders2"></i>
                            <span>Quotas</span>
                            <span class="nav-badge" id="quotasCount">5</span>
                        </a>
                    </li>
                    <li class="nav-item" th:classappend="${activeMenu == 'stats' ? 'active' : ''}">
                        <a class="nav-link" href="/stats">
                            <i class="bi bi-graph-up"></i>
                            <span>Statistiques</span>
                        </a>
                    </li>

                    <li class="nav-divider"></li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-gear"></i>
                            <span>Paramètres</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="return confirmLogout()">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Déconnexion</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="network-info">
                    <i class="bi bi-hdd-network"></i>
                    <div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">Interface réseau</div>
                        <div style="font-weight: 600;" id="networkInterface">wlo1</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content1">
            <div class="top-bar1">
                <div class="page-title">
                    <h1 th:text="${pageTitle}">Tableau de bord</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                            <li class="breadcrumb-item active" th:text="${pageTitle}" aria-current="page">Dashboard</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn-refresh" onclick="refreshData()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                    <div class="notification-badge">
                        <i class="bi bi-bell"></i>
                        <span class="badge">3</span>
                    </div>
                    <div class="date-time">
                        <i class="bi bi-calendar3"></i>
                        <span id="currentDateTime"></span>
                    </div>
                </div>
            </div>

            <!-- Notification Area -->
            <div id="notificationArea" class="notification-area" style="display: none;"></div>

            <!-- Dynamic Content -->
            <div th:replace="${content}"></div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!-- Dashboard JS -->
    <script src="/js/dashboard.js"></script>

    <script>
        // Date et heure en temps réel
        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            const element = document.getElementById('currentDateTime');
            if (element) {
                element.textContent = now.toLocaleDateString('fr-FR', options);
            }
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // Confirmation déconnexion
        function confirmLogout() {
            return confirm('Êtes-vous sûr de vouloir vous déconnecter ?');
        }

        // Rafraîchir les données
        function refreshData() {
            showNotification('Mise à jour des données...', 'info');
            setTimeout(() => window.location.reload(), 500);
        }

        // Afficher notification
        function showNotification(message, type = 'success') {
            const notificationArea = document.getElementById('notificationArea');
            if (!notificationArea) return;

            const icons = {
                success: 'check-circle-fill',
                error: 'exclamation-circle-fill',
                warning: 'exclamation-triangle-fill',
                info: 'info-circle-fill'
            };

            notificationArea.style.display = 'block';
            notificationArea.className = 'notification-area alert alert-' + type;
            notificationArea.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="bi bi-${icons[type] || 'bell-fill'} me-2"></i>
                    <span>${message}</span>
                    <button type="button" class="btn-close ms-auto" onclick="this.parentElement.parentElement.style.display='none'"></button>
                </div>
            `;

            setTimeout(() => {
                notificationArea.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
