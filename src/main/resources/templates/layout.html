<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Manager - Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link href="/css/dashboard.css" rel="stylesheet">
</head>

<body>
    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <i class="bi bi-wifi logo-icon"></i>
                <span class="logo-text">WiFi Manager</span>
            </div>

            <div class="user-info">
                <div class="user-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>
                <div class="user-details">
                    <div class="user-name">Administrateur</div>
                    <div class="user-role">Super Admin</div>
                </div>
            </div>

            <div class="modules-status" id="modulesStatus">
                <div class="status-item">
                    <span>Module 1 - Détection</span>
                    <span class="status-badge" id="module1Status">
                        <i class="bi bi-question-circle"></i> Chargement...
                    </span>
                </div>
                <div class="status-item">
                    <span>Module 2 - Enforcer</span>
                    <span class="status-badge" id="module2Status">
                        <i class="bi bi-question-circle"></i> Chargement...
                    </span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item" id="nav-dashboard">
                        <a class="nav-link" href="/">
                            <i class="bi bi-speedometer2"></i>
                            <span>Tableau de bord</span>
                        </a>
                    </li>
                    <li class="nav-item" id="nav-clients">
                        <a class="nav-link" href="/clients">
                            <i class="bi bi-devices"></i>
                            <span>Clients</span>
                            <span class="nav-badge" id="clientsCount">0</span>
                        </a>
                    </li>
                    <li class="nav-item" id="nav-quotas">
                        <a class="nav-link" href="/quotas">
                            <i class="bi bi-sliders2"></i>
                            <span>Quotas</span>
                            <span class="nav-badge" id="quotasCount">0</span>
                        </a>
                    </li>

                    <li class="nav-item" id="nav-blocked">
                        <a class="nav-link" href="/blocked">
                            <i class="bi bi-shield-lock"></i>
                            <span>Clients bloqués</span>
                            <span class="nav-badge" id="blockedCount">0</span>
                        </a>
                    </li>

                    <li class="nav-divider"></li>

                    <li class="nav-item" id="nav-stats">
                        <a class="nav-link" href="/stats">
                            <i class="bi bi-graph-up"></i>
                            <span>Statistiques</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="return confirmLogout()">
                            <i class="bi bi-box-arrow-right"></i>
                            <span>Déconnexion</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="network-info">
                    <i class="bi bi-hdd-network"></i>
                    <div>
                        <div style="font-size: 0.8rem; opacity: 0.7;">Interface réseau</div>
                        <div style="font-weight: 600;" id="networkInterface">wlo1</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <div class="page-title">
                    <h1 id="pageTitle">Tableau de bord</h1>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/">Accueil</a></li>
                            <li class="breadcrumb-item active" id="breadcrumbCurrent">Dashboard</li>
                        </ol>
                    </nav>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn-refresh" onclick="window.location.reload()">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                    <div class="notification-badge" onclick="showNotifications()">
                        <i class="bi bi-bell"></i>
                        <span class="badge" id="notificationCount">0</span>
                    </div>
                    <div class="date-time">
                        <i class="bi bi-calendar3"></i>
                        <span id="currentDateTime"></span>
                    </div>
                </div>
            </div>

            <!-- Notification Area -->
            <div id="notificationArea" class="notification-area" style="display: none;"></div>

            <!-- Page Content -->
            <div id="pageContent">
                <!-- Le contenu sera injecté ici -->
            </div>
        </main>
    </div>

    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!-- Dashboard JS (commun) -->
    <script src="/js/dashboard.js"></script>
    <!-- Page specific JS -->
    <!-- PAGE_SCRIPT -->

    <script>
        // Initialisation
        document.addEventListener('DOMContentLoaded', function () {
            updateDateTime();
            setInterval(updateDateTime, 1000);
            checkModulesStatus();
            setInterval(checkModulesStatus, 30000);
            updateNavActive();
        });

        function updateDateTime() {
            const now = new Date();
            const options = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            const element = document.getElementById('currentDateTime');
            if (element) {
                element.textContent = now.toLocaleDateString('fr-FR', options);
            }
        }

        function checkModulesStatus() {
            fetch('/api/health')
                .then(response => response.ok ? 'En ligne' : 'Hors ligne')
                .then(status => {
                    const el = document.getElementById('module1Status');
                    if (el) {
                        el.className = 'status-badge ' + (status === 'En ligne' ? 'status-online' : 'status-offline');
                        el.innerHTML = `<i class="bi bi-${status === 'En ligne' ? 'check-circle' : 'exclamation-circle'}-fill"></i> ${status}`;
                    }
                })
                .catch(() => {
                    const el = document.getElementById('module1Status');
                    if (el) {
                        el.className = 'status-badge status-offline';
                        el.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i> Hors ligne';
                    }
                });

            fetch('/health')
                .then(response => response.ok ? 'En ligne' : 'Hors ligne')
                .then(status => {
                    const el = document.getElementById('module2Status');
                    if (el) {
                        el.className = 'status-badge ' + (status === 'En ligne' ? 'status-online' : 'status-offline');
                        el.innerHTML = `<i class="bi bi-${status === 'En ligne' ? 'check-circle' : 'exclamation-circle'}-fill"></i> ${status}`;
                    }
                })
                .catch(() => {
                    const el = document.getElementById('module2Status');
                    if (el) {
                        el.className = 'status-badge status-offline';
                        el.innerHTML = '<i class="bi bi-exclamation-circle-fill"></i> Hors ligne';
                    }
                });
        }

        function updateNavActive() {
            const path = window.location.pathname;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            if (path === '/' || path === '/index') {
                document.getElementById('nav-dashboard')?.classList.add('active');
                document.getElementById('pageTitle').textContent = 'Tableau de bord';
                document.getElementById('breadcrumbCurrent').textContent = 'Dashboard';
            } else if (path === '/clients') {
                document.getElementById('nav-clients')?.classList.add('active');
                document.getElementById('pageTitle').textContent = 'Clients';
                document.getElementById('breadcrumbCurrent').textContent = 'Clients';
            } else if (path === '/quotas') {
                document.getElementById('nav-quotas')?.classList.add('active');
                document.getElementById('pageTitle').textContent = 'Quotas';
                document.getElementById('breadcrumbCurrent').textContent = 'Quotas';
            } else if (path === '/stats') {
                document.getElementById('nav-stats')?.classList.add('active');
                document.getElementById('pageTitle').textContent = 'Statistiques';
                document.getElementById('breadcrumbCurrent').textContent = 'Statistiques';
            }
        }

        function confirmLogout() {
            return confirm('Êtes-vous sûr de vouloir vous déconnecter ?');
        }

        function showNotification(message, type = 'success') {
            const notificationArea = document.getElementById('notificationArea');
            if (!notificationArea) return;

            const icons = {
                success: 'check-circle-fill',
                error: 'exclamation-circle-fill',
                warning: 'exclamation-triangle-fill',
                info: 'info-circle-fill'
            };

            notificationArea.style.display = 'block';
            notificationArea.className = 'notification-area alert alert-' + type;
            notificationArea.innerHTML = `
                <div class="d-flex align-items-center">
                    <i class="bi bi-${icons[type] || 'bell-fill'} me-2"></i>
                    <span>${message}</span>
                    <button type="button" class="btn-close ms-auto" onclick="this.parentElement.parentElement.style.display='none'"></button>
                </div>
            `;

            setTimeout(() => {
                notificationArea.style.display = 'none';
            }, 5000);
        }

        function showNotifications() {
            showNotification('Aucune nouvelle notification', 'info');
        }
    </script>
</body>

</html>
