<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Manager - Quotas</title>
    
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div id="pageContent" style="display: none;">
        <div class="row">
            <!-- Formulaire de création -->
            <div class="col-lg-4 mb-4">
                <div class="form-card">
                    <h3>
                        <i class="bi bi-plus-circle"></i>
                        Nouveau quota
                    </h3>
                    
                    <form id="quotaCreateForm">
                        <div class="form-group mb-3">
                            <label class="form-label">Adresse MAC</label>
                            <select class="form-control" id="macSelect" required>
                                <option value="">Sélectionner un client...</option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label">Temps (minutes)</label>
                            <input type="number" class="form-control" id="timeMinutes" 
                                   min="1" max="1440" value="60" required>
                            <small class="text-muted">1 - 1440 minutes (24h)</small>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label class="form-label">Données (Mo)</label>
                            <input type="number" class="form-control" id="dataMB" 
                                   min="1" max="10240" value="500" required>
                            <small class="text-muted">1 - 10240 Mo (10 Go)</small>
                        </div>
                        
                        <button type="button" class="btn btn-primary w-100" id="submitQuotaBtn">
                            <i class="bi bi-check-circle"></i>
                            Appliquer le quota
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Liste des quotas -->
            <div class="col-lg-8">
                <div class="table-container">
                    <div class="table-header">
                        <h3>Quotas actifs</h3>
                        <div class="table-search">
                            <i class="bi bi-search"></i>
                            <input type="text" id="searchQuotas" placeholder="Rechercher..." class="form-control">
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table" id="quotasTable">
                            <thead>
                                <tr>
                                    <th>Client</th>
                                    <th>Temps</th>
                                    <th>Données</th>
                                    <th>Utilisation</th>
                                    <th>Statut</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="quotasTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-5">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Chargement...</span>
                                        </div>
                                        <p class="mt-3">Chargement des quotas...</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!-- Dashboard JS -->
    <script src="/js/dashboard.js"></script>
    <!-- Quotas JS -->
    <script src="/js/quotas.js"></script>
</body>
</html>
