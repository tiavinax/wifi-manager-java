<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Manager - Clients</title>
    
    <!-- Bootstrap CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Dashboard CSS -->
    <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>
    <!-- La page sera injectée dans layout.html -->
    
    <!-- PAGE_SCRIPT sera remplacé par /js/clients.js -->
    
    <div id="pageContent" style="display: none;">
        <!-- En-tête avec recherche -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des clients connectés</h2>
            <div class="table-search">
                <i class="bi bi-search"></i>
                <input type="text" id="searchClients" placeholder="Rechercher par MAC ou IP..." class="form-control">
            </div>
        </div>
        
        <!-- Statistiques clients -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-info">
                        <h4>Clients total</h4>
                        <div class="stat-number" id="totalClients">0</div>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-devices"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-info">
                        <h4>Clients actifs</h4>
                        <div class="stat-number" id="activeClients">0</div>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-check-circle"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card">
                    <div class="stat-info">
                        <h4>Trafic total</h4>
                        <div class="stat-number" id="totalTraffic">0 B</div>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-arrow-up-down"></i>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Tableau des clients -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table" id="clientsTable">
                    <thead>
                        <tr>
                            <th>Adresse MAC</th>
                            <th>Adresse IP</th>
                            <th>Hostname</th>
                            <th>Statut</th>
                            <th>Trafic</th>
                            <th>Quota</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTableBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Chargement...</span>
                                </div>
                                <p class="mt-3">Chargement des clients...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Modal création quota -->
        <div class="modal fade" id="quotaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Créer un quota</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="quotaForm">
                            <div class="mb-3">
                                <label class="form-label">Adresse MAC</label>
                                <input type="text" class="form-control" id="modalMacAddress" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Temps (minutes)</label>
                                <input type="number" class="form-control" id="modalTimeMinutes" 
                                       min="1" max="1440" value="60">
                                <small class="text-muted">Maximum: 24h (1440 min)</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Données (Mo)</label>
                                <input type="number" class="form-control" id="modalDataMB" 
                                       min="1" max="10240" value="500">
                                <small class="text-muted">Maximum: 10 Go (10240 Mo)</small>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="button" class="btn btn-primary" id="createQuotaBtn">Créer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="/js/bootstrap.bundle.min.js"></script>
    <!-- Dashboard JS (commun) -->
    <script src="/js/dashboard.js"></script>
    <!-- Clients JS -->
    <script src="/js/clients.js"></script>
</body>
</html>
