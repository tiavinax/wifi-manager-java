<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title th:text="${pageTitle} + ' - WiFi Manager'">WiFi Manager Dashboard</title>

    <!-- Bootstrap 5 CSS -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom Dashboard CSS -->
    <link href="/css/dashboard.css" rel="stylesheet">
<body>
    <div th:fragment="content">
        <!-- En-tête avec recherche -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des clients</h2>
            <div class="table-search">
                <i class="bi bi-search"></i>
                <input type="text" id="searchClients" data-table="clientsTable" 
                       placeholder="Rechercher par MAC ou IP..." class="form-control">
            </div>
        </div>
        
        <!-- Tableau des clients -->
        <div class="table-container">
            <div class="table-responsive">
                <table class="table" id="clientsTable">
                    <thead>
                        <tr>
                            <th>Adresse MAC</th>
                            <th>Adresse IP</th>
                            <th>Hostname</th>
                            <th>Statut</th>
                            <th>Trafic</th>
                            <th>Quota restant</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="client : ${clients}">
                            <td>
                                <strong th:text="${client.macAddress}">AA:BB:CC:DD:EE:FF</strong>
                                <br><small class="text-muted" th:text="${client.deviceType}">Inconnu</small>
                            </td>
                            <td th:text="${client.ipAddress}">192.168.0.1</td>
                            <td th:text="${client.hostname ?: '-'}">-</td>
                            <td>
                                <span th:class="'status-badge ' + ${client.statusClass}" 
                                      th:text="${client.statusText}">Actif</span>
                            </td>
                            <td th:text="${client.formattedBytes}">0 B</td>
                            <td>
                                <span th:if="${client.deviceType?.startsWith('Quota:')}" 
                                      th:text="${client.deviceType}" class="badge bg-info">30min</span>
                                <span th:unless="${client.deviceType?.startsWith('Quota:')}" 
                                      class="badge bg-secondary">Aucun</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-danger" 
                                        th:onclick="'disconnectClient(\'' + ${client.macAddress} + '\')'">
                                    <i class="bi bi-power"></i>
                                </button>
                                <button class="btn btn-sm btn-primary" 
                                        th:onclick="'showQuotaForm(\'' + ${client.macAddress} + '\')'">
                                    <i class="bi bi-sliders2"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${clients.empty}">
                            <td colspan="7" class="text-center text-muted py-5">
                                <i class="bi bi-wifi-off" style="font-size: 3rem;"></i>
                                <p class="mt-3">Aucun client connecté</p>
                                <p class="small">Vérifiez que le Module 1 (Détection) est démarré</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Modal création quota -->
        <div class="modal fade" id="quotaModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Créer un quota</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="quotaForm">
                            <div class="mb-3">
                                <label class="form-label">Adresse MAC</label>
                                <input type="text" class="form-control" id="modalMacAddress" readonly>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Temps (minutes)</label>
                                <input type="number" class="form-control" id="modalTimeMinutes" 
                                       min="1" max="1440" value="60">
                                <small class="text-muted">Maximum: 24h (1440 min)</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Données (Mo)</label>
                                <input type="number" class="form-control" id="modalDataMB" 
                                       min="1" max="10240" value="500">
                                <small class="text-muted">Maximum: 10 Go (10240 Mo)</small>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                        <button type="button" class="btn btn-primary" onclick="createQuota()">Créer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        let currentMacAddress = '';
        
        function showQuotaForm(mac) {
            currentMacAddress = mac;
            document.getElementById('modalMacAddress').value = mac;
            new bootstrap.Modal(document.getElementById('quotaModal')).show();
        }
        
        function createQuota() {
            const mac = currentMacAddress;
            const time = document.getElementById('modalTimeMinutes').value;
            const data = document.getElementById('modalDataMB').value;
            
            const params = new URLSearchParams({
                mac: mac,
                time: time,
                data: data
            });
            
            fetch('/api/quotas/create?' + params.toString(), {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.macAddress) {
                    showNotification('Quota créé avec succès', 'success');
                    setTimeout(() => window.location.reload(), 1500);
                }
            })
            .catch(error => {
                showNotification('Erreur: ' + error.message, 'error');
            });
            
            bootstrap.Modal.getInstance(document.getElementById('quotaModal')).hide();
        }
        
        function disconnectClient(mac) {
            if (confirm('Voulez-vous déconnecter ce client ?')) {
                fetch('/api/clients/' + mac + '/disconnect', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        showNotification('Client déconnecté', 'success');
                        setTimeout(() => window.location.reload(), 1500);
                    }
                });
            }
        }
        
        function refreshClients() {
            fetch('/api/clients')
                .then(response => response.json())
                .then(data => {
                    // Mise à jour du tableau
                    console.log('Clients mis à jour:', data.length);
                })
                .catch(console.error);
        }
        
        // Recherche en temps réel
        document.getElementById('searchClients')?.addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const rows = document.querySelectorAll('#clientsTable tbody tr');
            
            rows.forEach(row => {
                const mac = row.cells[0]?.textContent.toLowerCase() || '';
                const ip = row.cells[1]?.textContent.toLowerCase() || '';
                
                if (mac.includes(searchTerm) || ip.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
        
        // Rafraîchir toutes les 30s
        setInterval(refreshClients, 30000);
        /*]]>*/
    </script>
</body>
</html>
